<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1秒体感トレーニング</title>
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#18232E; --sub:#5A6876; --line:#CBD3DB;
  --sheet:#1F5FA8; --sheet-soft:#DDE8F6; --hazard:#F2B705; --hazard-soft:#FBF0C8; --hazard-ink:#1A1A1A;
  --perfect:#7A3FE0; --great:#1E8E4E; --good:#1A87A0; --miss:#C62828; --warn:#A86300;
  --band:rgba(30,142,78,.13);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161E; --surface:#1B2430; --ink:#E8EDF2; --sub:#9AA7B4; --line:#334150;
    --sheet:#5B9BE6; --sheet-soft:#1C2E45; --hazard:#F2B705; --hazard-soft:#3A3115; --hazard-ink:#1A1A1A;
    --perfect:#A47BFF; --great:#3DBB72; --good:#3BB5CF; --miss:#EF5B5B; --warn:#E3A13A;
    --band:rgba(61,187,114,.16);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;
}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sheet);outline-offset:2px}

/* ホーム */
.brand{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.brand .seal{flex:none;width:84px;height:84px;border-radius:50%;border:4px solid var(--miss);color:var(--miss);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-align:center;transform:rotate(-10deg)}
.brand .seal small{font-size:12px;line-height:1.1;letter-spacing:-.02em}
.brand .seal b{font-size:28px;line-height:1.05;letter-spacing:.02em}
.brand h1{margin:0;font-size:clamp(23px,6.4vw,32px);line-height:1.2;white-space:nowrap}
.brand p{margin:2px 0 0;color:var(--sub);font-size:15px}
.field{display:block;margin-bottom:14px}
.field span,.sec-label{display:block;font-size:15px;color:var(--sub);margin:0 0 4px}
.field input,.field select{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:54px}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:16px}
.seg button{flex:1;padding:12px 0;border:0;background:var(--surface);font-size:17px;font-weight:700}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--surface)}
.best{background:var(--surface);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.best span{color:var(--sub);font-size:15px}
.best b{font-size:24px}
.mode{display:block;width:100%;text-align:left;margin-bottom:12px;padding:16px 18px;border:0;border-radius:14px;color:#fff}
.mode b{display:block;font-size:24px;margin-bottom:2px}
.mode span{display:block;font-size:15px;opacity:.92;line-height:1.5}
.mode.practice{background:var(--good)}
.mode.real{background:var(--sheet)}
.mode:active{transform:scale(.98)}

/* 共通 */
.big{display:block;width:100%;min-height:62px;font-size:20px;font-weight:700;border-radius:12px;border:2px solid var(--ink);background:var(--surface);margin-top:12px}
.big.primary{background:var(--sheet);border-color:var(--sheet);color:#fff}
.ghost{background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-size:16px}
.ghost.full{display:block;width:100%;margin-top:12px;min-height:52px}
.ghost.danger{color:var(--miss);border-color:var(--miss)}
.row{display:flex;gap:10px}
.row .big{flex:1}

/* カウントダウン */
#count{text-align:center}
#count .num{font-size:130px;font-weight:800;margin-top:24vh;line-height:1}
#count .num.go{font-size:72px;color:var(--great)}
#count p{color:var(--sub)}

/* 実施画面 */
.hud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hud .score{flex:1}
.hud .score span{display:block;font-size:13px;color:var(--sub);line-height:1}
.hud .score b{font-size:32px;line-height:1.1}
.gain{font-size:18px;font-weight:800;color:var(--great);margin-left:8px;opacity:0}
.gain.show{animation:gain .7s ease-out}
@keyframes gain{0%{opacity:1;transform:translateY(6px)}100%{opacity:0;transform:translateY(-10px)}}
.combo{font-weight:800;font-size:20px;color:var(--perfect);min-width:5em;text-align:right}
.dots{display:flex;gap:5px;margin-bottom:12px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.now{background:var(--hazard)}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{position:relative;display:flex;flex-direction:column;align-items:stretch;height:min(56vh,440px);min-height:300px;padding:0;border-radius:16px;border:3px solid var(--line);background:var(--surface);overflow:hidden;text-align:center;transition:opacity .15s,transform .08s}
.phead{display:block;padding:6px 0;font-weight:800;font-size:17px}
.panel.sheet .phead{background:var(--sheet);color:#fff}
.panel.prod .phead{background:repeating-linear-gradient(-45deg,var(--hazard) 0 14px,var(--hazard-ink) 14px 28px)}
.panel.prod .phead span{background:var(--hazard);color:var(--hazard-ink);padding:0 10px;border-radius:4px}
.plabel{display:block;color:var(--sub);font-size:15px;margin-top:10px}
.pval{display:block;font-size:clamp(24px,7vw,40px);font-weight:800;line-height:1.25;padding:2px 6px;word-break:break-all}
.pval small{font-size:.5em;margin-left:2px}
.pfoot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--good);stroke-dasharray:276.46;stroke-dashoffset:276.46}
.ring.run .fill{animation:ring 1s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.ptap{font-size:22px;font-weight:800;opacity:0}
.panel.active{border-color:var(--ink);transform:none}
.panel.active.sheet{background:var(--sheet-soft);box-shadow:0 0 0 4px var(--sheet)}
.panel.active.prod{background:var(--hazard-soft);box-shadow:0 0 0 4px var(--hazard)}
.panel.active .ptap{opacity:1}
.panel.wait{opacity:.35}
.panel:active.active{transform:scale(.985)}
.stamp{position:absolute;left:50%;top:56%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:5px solid currentColor;display:none;flex-direction:column;align-items:center;justify-content:center;font-weight:800;background:var(--surface);transform:rotate(-12deg)}
.stamp b{font-size:19px;line-height:1.2}
.stamp span{font-size:20px}
.stamp.show{display:flex;animation:stamp .22s ease-out}
@keyframes stamp{0%{transform:rotate(-12deg) scale(1.7);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.j-p{color:var(--perfect)} .j-g{color:var(--great)} .j-d{color:var(--good)} .j-m{color:var(--miss)}
.hint{color:var(--sub);font-size:15px;text-align:center;margin:12px 0 0}
.stage{position:relative}
.quiz{position:absolute;inset:0;z-index:5;background:var(--surface);border:3px solid var(--perfect);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center}
.quiz[hidden]{display:none}
.quiz .qtag{align-self:center;background:var(--perfect);color:#fff;font-weight:800;font-size:14px;border-radius:20px;padding:2px 14px}
.quiz .qtext{text-align:center;font-size:24px;font-weight:800;margin:8px 0 14px}
.quiz .qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz .qopts button{min-height:76px;font-size:clamp(22px,6.5vw,32px);font-weight:800;border:3px solid var(--ink);border-radius:12px;background:var(--surface)}
.quiz .qopts button small{font-size:.55em;margin-left:2px}
.quiz .qopts button.right{background:var(--great);border-color:var(--great);color:#fff}
.quiz .qopts button.wrong{background:var(--miss);border-color:var(--miss);color:#fff}
.quiz .qmsg{text-align:center;font-size:18px;font-weight:800;min-height:1.6em;margin-top:12px}
.runfoot{display:flex;justify-content:center;margin-top:10px}

/* 結果 */
.reshead{display:flex;align-items:center;gap:16px;margin:4px 0 14px}
.rank{flex:none;width:112px;height:112px;border-radius:50%;border:6px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;transform:rotate(-10deg);animation:stamp .3s ease-out}
.rank.S{color:var(--perfect)} .rank.A{color:var(--great)} .rank.B{color:var(--good)} .rank.C{color:var(--miss)}
.reshead .sc span{display:block;color:var(--sub);font-size:15px}
.reshead .sc b{font-size:40px;line-height:1.1}
.reshead .sc em{display:inline-block;font-style:normal;font-weight:800;color:#fff;background:var(--miss);border-radius:6px;padding:0 8px;font-size:15px;margin-top:4px}
.verdict{background:var(--surface);border-left:8px solid var(--great);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.verdict.warn{border-left-color:var(--warn)}
.verdict.bad{border-left-color:var(--miss)}
.verdict b{display:block;font-size:19px}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.counts div{background:var(--surface);border-radius:10px;padding:8px 4px;text-align:center}
.counts span{display:block;font-size:12px;font-weight:700}
.counts b{font-size:24px}
.stats{background:var(--surface);border-radius:12px;padding:4px 16px;margin-bottom:14px}
.st{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st span{color:var(--sub);font-size:16px}
.st b{font-size:21px}
.st b.good{color:var(--great)} .st b.bad{color:var(--miss)} .st b.warn{color:var(--warn)}
.chartbox{background:var(--surface);border-radius:12px;padding:12px 10px 8px;margin-bottom:14px}
.chartbox canvas{display:block;width:100%;height:200px}
.ctitle{font-size:15px;font-weight:700;padding:0 6px 6px}
.legend{font-size:14px;color:var(--sub);padding:6px 6px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.delta{background:var(--surface);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:16px}
.delta:empty{display:none}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:12px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub)}
.empty{background:var(--surface);border-radius:12px;padding:20px 16px;color:var(--sub)}
.runbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.runbar h2{font-size:19px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:24px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.stamp.show,.rank,.gain.show{animation:none}.gain.show{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

<!-- ホーム -->
<section id="home" class="screen">
  <div class="brand">
    <div class="seal"><small>1ポイント</small><b>1秒</b></div>
    <div><h1>1秒体感トレーニング</h1><p>左で1秒、右で1秒。感覚だけでタップ</p></div>
  </div>
  <label class="field"><span>氏名</span><select id="name" autocomplete="off">
    <option value="" disabled selected>集荷者を選択してください</option>
    <optgroup label="1係">
      <option value="フルヤナオキ">フルヤナオキ</option>
      <option value="キトウノブマサ">キトウノブマサ</option>
      <option value="フクダテツヤ">フクダテツヤ</option>
      <option value="クロキケンジ">クロキケンジ</option>
      <option value="オクノリュウイチ">オクノリュウイチ</option>
      <option value="ツカモトテッペイ">ツカモトテッペイ</option>
      <option value="クロキリョウスケ">クロキリョウスケ</option>
      <option value="オオガリョウヤ">オオガリョウヤ</option>
      <option value="ハギワラケイスケ">ハギワラケイスケ</option>
      <option value="アンドウリュウジ">アンドウリュウジ</option>
      <option value="スズキトシミツ">スズキトシミツ</option>
      <option value="イトウリョウゴ">イトウリョウゴ</option>
      <option value="スズキマサミ">スズキマサミ</option>
      <option value="カネコタケシ">カネコタケシ</option>
      <option value="ツルマルユウタ">ツルマルユウタ</option>
      <option value="クサヅミアキラ">クサヅミアキラ</option>
      <option value="トミタタカユキ">トミタタカユキ</option>
      <option value="オグラケン">オグラケン</option>
      <option value="マツバラユタカ">マツバラユタカ</option>
      <option value="ミヤザキコウダイ">ミヤザキコウダイ</option>
      <option value="ヤマモトタカヒロ">ヤマモトタカヒロ</option>
      <option value="ドイユウマ">ドイユウマ</option>
      <option value="アワキ エイト">アワキ エイト</option>
      <option value="コトウトモカズ">コトウトモカズ</option>
      <option value="シバタ トモヤ">シバタ トモヤ</option>
      <option value="イシカワソウタ">イシカワソウタ</option>
      <option value="ニシヤマヒロノリ">ニシヤマヒロノリ</option>
    </optgroup>
    <optgroup label="2係">
      <option value="イイダタクヤ">イイダタクヤ</option>
      <option value="スギヤマノブヒコ">スギヤマノブヒコ</option>
      <option value="オキタナオユキ">オキタナオユキ</option>
      <option value="マツダタカシ">マツダタカシ</option>
      <option value="イマイヤスヒロ">イマイヤスヒロ</option>
      <option value="コンドウタカユキ">コンドウタカユキ</option>
      <option value="ナカヤマヒロキ">ナカヤマヒロキ</option>
      <option value="オノウエマサアキ">オノウエマサアキ</option>
      <option value="フルイサトシ">フルイサトシ</option>
      <option value="スズキアキヒロ">スズキアキヒロ</option>
      <option value="マツオカツミ">マツオカツミ</option>
      <option value="ウチヤマ ノボル">ウチヤマ ノボル</option>
      <option value="ヤノアキノリ">ヤノアキノリ</option>
      <option value="アラマキユウジ">アラマキユウジ</option>
      <option value="トクダヒデキ">トクダヒデキ</option>
      <option value="オチアイダイスケ">オチアイダイスケ</option>
      <option value="タカハシユウスケ">タカハシユウスケ</option>
      <option value="クラタトシヤ">クラタトシヤ</option>
      <option value="スギモト ショウキ">スギモト ショウキ</option>
      <option value="イナトシヤス">イナトシヤス</option>
      <option value="ミウラシンイチ">ミウラシンイチ</option>
      <option value="カツノジュンジ">カツノジュンジ</option>
      <option value="ヤザキヨウスケ">ヤザキヨウスケ</option>
      <option value="ナガエ アツキ">ナガエ アツキ</option>
      <option value="イマムラユウト">イマムラユウト</option>
      <option value="シゲタハヤト">シゲタハヤト</option>
      <option value="ナカシマカズオ">ナカシマカズオ</option>
      <option value="キシガミアヤキ">キシガミアヤキ</option>
      <option value="イノウエハルト">イノウエハルト</option>
    </optgroup>
    <optgroup label="3係">
      <option value="ヤマグチナオユキ">ヤマグチナオユキ</option>
      <option value="ヤマシタジュン">ヤマシタジュン</option>
    </optgroup>
  </select></label>
  <span class="sec-label">問題数</span>
  <div class="seg" id="nSeg"><button data-n="10" class="on">10</button><button data-n="20">20</button></div>
  <div class="best" id="bestBox"><span>自己ベスト</span><b id="bestVal">—</b></div>
  <button class="mode practice" data-practice="1"><b>練習</b><span>1秒で一周するリングが出ます。1秒の長さを目で覚える。記録は残りません。</span></button>
  <button class="mode real" data-practice="0"><b>本番</b><span>リングなし。感覚だけで勝負。スコアと履歴が残ります。</span></button>
  <button id="btnHistory" class="ghost full">履歴・推移を見る</button>
</section>

<!-- カウントダウン -->
<section id="count" class="screen" hidden>
  <div class="num" id="countNum">3</div>
  <p>左が光ったら、1秒たったと感じたところで左をタップ。<br>次に右が光ります。<br>ときどき、今見た内容を聞かれます。</p>
</section>

<!-- 実施 -->
<section id="run" class="screen" hidden>
  <div class="hud">
    <div class="score"><span>スコア</span><b id="score">0</b><span class="gain" id="gain"></span></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="stage">
  <div class="arena">
    <button class="panel sheet" id="pL" data-side="L">
      <span class="phead">確認票</span>
      <span class="plabel" id="lLabel"></span>
      <span class="pval" id="lVal"></span>
      <span class="pfoot"><svg class="ring" id="lRing" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="fill" cx="50" cy="50" r="44"/></svg><span class="ptap">タップ</span></span>
      <span class="stamp" id="lStamp"></span>
    </button>
    <button class="panel prod" id="pR" data-side="R">
      <span class="phead"><span>製品</span></span>
      <span class="plabel" id="rLabel"></span>
      <span class="pval" id="rVal"></span>
      <span class="pfoot"><svg class="ring" id="rRing" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44"/><circle class="fill" cx="50" cy="50" r="44"/></svg><span class="ptap">タップ</span></span>
      <span class="stamp" id="rStamp"></span>
    </button>
  </div>
  <div class="quiz" id="quiz" hidden>
    <span class="qtag">抜き打ち確認</span>
    <div class="qtext" id="qText"></div>
    <div class="qopts" id="qOpts"></div>
    <div class="qmsg" id="qMsg"></div>
  </div>
  </div>
  <p class="hint" id="runHint"></p>
  <div class="runfoot"><button id="btnAbort" class="ghost">中止</button></div>
</section>

<!-- 結果 -->
<section id="result" class="screen" hidden>
  <div class="reshead">
    <div class="rank" id="rank"></div>
    <div class="sc"><span id="resSub"></span><b id="resScore"></b><br><em id="newBest" hidden>自己ベスト更新</em></div>
  </div>
  <div class="verdict" id="verdict"></div>
  <div class="counts" id="counts"></div>
  <div class="stats" id="stats"></div>
  <div class="chartbox"><div class="ctitle">1回ごとの時間（点線＝1秒、帯＝グッド以上）</div><canvas id="resChart"></canvas>
    <div class="legend"><span><i style="background:var(--sheet)"></i>確認票（左）</span><span><i style="background:var(--hazard)"></i>製品（右）</span></div></div>
  <button id="btnCopy" class="big primary">結果をコピー（LINE貼り付け用）</button>
  <div class="row"><button id="btnAgain" class="big">もう一度</button><button id="btnHome" class="big">ホームへ</button></div>
</section>

<!-- 履歴 -->
<section id="history" class="screen" hidden>
  <div class="runbar"><h2 id="histTitle"></h2><button id="btnHistBack" class="ghost">戻る</button></div>
  <div id="histBody"></div>
  <button id="btnTsv" class="big">履歴をコピー（Excel貼り付け用）</button>
  <button id="btnClear" class="ghost danger full">この人の履歴を削除</button>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const KEY='ppt1s_game_v1', NKEY='ppt1s_name';
let nPoints=10, state=null, last=null, lastPractice=false;

/* ---------- 保存 ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){alert('履歴を保存できませんでした。ブラウザのプライベートモードを解除してください。')}}
try{const saved=localStorage.getItem(NKEY)||'';const savedNorm=saved.normalize('NFKC').trim();const match=[...$('#name').options].find(o=>o.value&&o.value.normalize('NFKC').trim()===savedNorm);if(match)$('#name').value=match.value}catch(e){}

/* ---------- 共通 ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const r2=x=>Math.round(x*100)/100;
const f2=x=>Number(x).toFixed(2);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function show(id){document.querySelectorAll('.screen').forEach(s=>s.hidden=(s.id!==id));window.scrollTo(0,0)}
function fmtDate(ts,short){const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return short?`${d.getMonth()+1}/${d.getDate()}`:`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1600)}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('コピーしました');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  ta.remove();ok?toast('コピーしました'):prompt('下の文字を長押ししてコピーしてください',t);
}
function getName(){const n=$('#name').value.trim();try{localStorage.setItem(NKEY,n)}catch(e){}return n}
function myRecords(){const n=$('#name').value.normalize('NFKC').trim();return load().filter(r=>!n||String(r.name||'').normalize('NFKC').trim()===n)}

/* ---------- 判定 ---------- */
const JUDGE=[
  {max:.07,name:'パーフェクト',key:'p',base:100},
  {max:.12,name:'グレート',key:'g',base:60},
  {max:.20,name:'グッド',key:'d',base:30}
];
const MISS={name:'ミス',key:'m',base:0};
function judgeOf(dt){const dev=Math.round(Math.abs(dt-1)*1000)/1000;for(const j of JUDGE)if(dev<=j.max)return j;return MISS}
function rankOf(mae,qMiss){const k=mae<=.07?0:mae<=.12?1:mae<=.20?2:3;return ['S','A','B','C'][Math.min(3,k+qMiss)]}

/* ---------- 確認ポイント（表示用） ---------- */
const LET='ABCDEFGHJKLMNPRSTUVWXY';
const digits=n=>Array.from({length:n},()=>rnd(10)).join('');
function nearDigits(v){const a=[...v],idx=a.map((c,i)=>/\d/.test(c)?i:-1).filter(i=>i>=0),i=pick(idx);let d;do{d=String(rnd(10))}while(d===a[i]);a[i]=d;return a.join('')}
/* 左右：LH/RH・R/L・数字+R/L（8R/8Lなど）を出題 */
const flipLR=v=>v.replace(/[RL]/,c=>c==='R'?'L':'R');
function genLR(){
  const t=rnd(3);
  if(t===0)return pick(['LH','RH']);
  if(t===1)return pick(['R','L']);
  return (1+rnd(9))+pick(['R','L']);
}
function nearLR(v){
  const m=v.match(/^(\d)([RL])$/);
  if(!m)return flipLR(v);
  let d;do{d=String(1+rnd(9))}while(d===m[1]);
  const r=rnd(3);
  return r===0?flipLR(v):r===1?d+m[2]:d+(m[2]==='R'?'L':'R');
}
const CATS=[
  /* 品番（4文字）は除外 */
  {label:'数量',unit:'個',gen:()=>String(2+rnd(47)),near:v=>(Math.random()<.4&&v.length===2&&v[1]!=='0')?v[1]+v[0]:String(Math.max(1,+v+pick([-3,-2,-1,1,2,3])))},
  {label:'色',gen:()=>pick(['赤','橙','黄','緑','青','紺','白','灰','黒','茶'])},
  /* ロット（4桁）は除外 */
  {label:'向き',gen:()=>pick(['↑','→','↓','←'])},
  {label:'左右',gen:genLR,near:nearLR}
];
function choicesOf(p){
  const c=CATS[p.ci],seen=new Set([p.val]),out=[p.val],want=(c.label==='左右'&&!/\d/.test(p.val))?2:4;let g=0;
  if(c.label==='左右'){const f=flipLR(p.val);seen.add(f);out.push(f)}
  while(out.length<want&&g++<300){const v=c.near?c.near(p.val):c.gen();if(!seen.has(v)){seen.add(v);out.push(v)}}
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out;
}
function makePoints(n){const pts=[];let prev=null;
  for(let i=0;i<n;i++){let ci;do{ci=rnd(CATS.length)}while(ci===prev);prev=ci;const c=CATS[ci];pts.push({ci,label:c.label,unit:c.unit||'',val:c.gen()})}
  return pts}
const valHtml=p=>p.val+(p.unit?`<small>${p.unit}</small>`:'');

/* ---------- ホーム ---------- */
function renderBest(){const rs=myRecords();$('#bestVal').textContent=rs.length?Math.max(...rs.map(r=>r.score))+' 点':'—'}
renderBest();
$('#name').addEventListener('change',renderBest);
$('#nSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  nPoints=+b.dataset.n;$('#nSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.practice==='1',nPoints)));
$('#btnHistory').addEventListener('click',()=>{getName();renderHistory();show('history')});

/* ---------- 実施 ---------- */
function start(practice,n){
  const name=getName();
  if(!name){alert('氏名を選択してください');$('#name').focus();return}
  lastPractice=practice;
  state={practice,n,name,i:0,side:null,t0:0,lock:true,points:makePoints(n),tL:[],tR:[],taps:[],score:0,combo:0,maxCombo:0,timers:[],quizSet:pickQuiz(n),q:0,qc:0,qMiss:0};
  $('#quiz').hidden=true;
  $('#dots').innerHTML='<i></i>'.repeat(n);
  $('#score').textContent='0';$('#combo').textContent='';
  show('count');
  const seq=['3','2','1','スタート'];let k=0;const el=$('#countNum');
  const tick=()=>{el.textContent=seq[k];el.classList.toggle('go',k===3);k++;
    state.timers.push(setTimeout(k<seq.length?tick:()=>{show('run');beginPoint()},k<seq.length?700:500))};
  tick();
}
function clearTimers(){if(state)state.timers.forEach(clearTimeout)}
function beginPoint(){
  const s=state,p=s.points[s.i];
  $('#dots').querySelectorAll('i').forEach((d,i)=>d.className=i<s.i?'done':(i===s.i?'now':''));
  $('#lLabel').textContent=p.label;$('#rLabel').textContent=p.label;
  $('#lVal').innerHTML=valHtml(p);$('#rVal').innerHTML='　';
  ['#lStamp','#rStamp'].forEach(q=>{$(q).className='stamp';$(q).innerHTML=''});
  setActive('L');
}
function setActive(side){
  const s=state;s.side=side;s.lock=true;
  $('#pL').className='panel sheet '+(side==='L'?'active':'wait');
  $('#pR').className='panel prod '+(side==='R'?'active':'wait');
  ['#lRing','#rRing'].forEach(q=>{const r=$(q);r.classList.remove('run');r.style.display=s.practice?'':'none'});
  $('#runHint').textContent=side==='L'?'左を見て、1秒たったら左をタップ':'右を見て、1秒たったら右をタップ';
  requestAnimationFrame(()=>{
    if(s!==state)return;
    if(s.practice){const r=$(side==='L'?'#lRing':'#rRing');void r.getBoundingClientRect();r.classList.add('run')}
    s.t0=performance.now();s.lock=false;
  });
}
function onTap(side){
  const s=state;if(!s||s.lock||side!==s.side)return;
  const dt=(performance.now()-s.t0)/1000;if(dt<0.1)return;
  s.lock=true;
  const j=judgeOf(dt);
  if(j.key==='m')s.combo=0;else{s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo)}
  const gain=j.base?j.base+Math.min(s.combo,10)*5:0;
  s.score+=gain;
  s.taps.push({side,dt,key:j.key,base:j.base});
  (side==='L'?s.tL:s.tR).push(dt);
  // スタンプ
  const st=$(side==='L'?'#lStamp':'#rStamp');
  const diff=dt-1,sign=diff>=0?'+':'−';
  st.className='stamp j-'+j.key;st.innerHTML=`<b>${j.name}</b><span>${f2(dt)}秒</span><span style="font-size:13px">${sign}${f2(Math.abs(diff))}</span>`;
  void st.offsetWidth;st.classList.add('show');
  $(side==='L'?'#lRing':'#rRing').classList.remove('run');
  // スコア表示
  $('#score').textContent=s.score;
  const g=$('#gain');g.textContent=gain?'+'+gain:'';g.classList.remove('show');void g.offsetWidth;if(gain)g.classList.add('show');
  $('#combo').textContent=s.combo>=2?s.combo+' コンボ':'';
  if(side==='L'){
    const p=s.points[s.i];$('#rVal').innerHTML=valHtml(p);
    setActive('R');
  }else{
    $('#pR').className='panel prod wait';$('#pL').className='panel sheet wait';
    $('#runHint').textContent='';
    if(s.quizSet.has(s.i)){
      $('#lVal').innerHTML='？';$('#rVal').innerHTML='？';
      s.timers.push(setTimeout(showQuiz,450));
    }else s.timers.push(setTimeout(nextPoint,800));
  }
}
function nextPoint(){const s=state;if(!s)return;s.i++;s.i<s.n?beginPoint():finish()}
function pickQuiz(n){const k=Math.max(2,Math.round(n/5)),idx=Array.from({length:n},(_,i)=>i);
  for(let i=n-1;i>0;i--){const j=rnd(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return new Set(idx.slice(0,k))}
function showQuiz(){
  const s=state;if(!s)return;const p=s.points[s.i];
  $('#qText').textContent=`今の「${p.label}」は？`;$('#qMsg').textContent='';
  $('#qOpts').innerHTML=choicesOf(p).map(v=>`<button data-v="${v}">${v}${p.unit?`<small>${p.unit}</small>`:''}</button>`).join('');
  $('#quiz').hidden=false;s.quizOpen=true;
}
$('#qOpts').addEventListener('click',e=>{
  const b=e.target.closest('button'),s=state;if(!b||!s||!s.quizOpen)return;
  s.quizOpen=false;const p=s.points[s.i],ok=b.dataset.v===p.val;s.q++;
  $('#qOpts').querySelectorAll('button').forEach(x=>{if(x.dataset.v===p.val)x.classList.add('right')});
  if(ok){s.qc++;s.score+=50;$('#score').textContent=s.score;$('#qMsg').textContent='正解　+50';$('#qMsg').className='qmsg j-g'}
  else{b.classList.add('wrong');s.qMiss++;s.combo=0;$('#combo').textContent='';
    $('#qMsg').textContent='不正解。見たつもりに注意';$('#qMsg').className='qmsg j-m'}
  s.timers.push(setTimeout(()=>{$('#quiz').hidden=true;nextPoint()},ok?700:1600));
});
document.querySelectorAll('.panel').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();onTap(b.dataset.side)}));
document.addEventListener('keydown',e=>{
  if($('#run').hidden||!state)return;
  if(e.key==='ArrowLeft'||e.key==='f'||e.key==='F'){e.preventDefault();onTap('L')}
  if(e.key==='ArrowRight'||e.key==='j'||e.key==='J'){e.preventDefault();onTap('R')}
  if(e.code==='Space'){e.preventDefault();onTap(state.side)}
});
$('#btnAbort').addEventListener('click',()=>{
  if(!confirm('中止しますか？この回の記録は残りません。'))return;
  clearTimers();state=null;show('home');
});

/* ---------- 結果 ---------- */
function finish(){
  const s=state,all=s.taps.map(t=>t.dt);
  const cnt=k=>s.taps.filter(t=>t.key===k).length;
  const mae=r2(mean(all.map(t=>Math.abs(t-1))));
  const rec={ts:Date.now(),name:s.name,n:s.n,score:s.score,rank:rankOf(mae,s.qMiss),
    sheetAvg:r2(mean(s.tL)),prodAvg:r2(mean(s.tR)),mae,
    p:cnt('p'),g:cnt('g'),d:cnt('d'),m:cnt('m'),maxCombo:s.maxCombo,q:s.q,qc:s.qc};
  let isBest=false;
  if(!s.practice){
    const prev=myRecords();isBest=prev.length>0&&rec.score>Math.max(...prev.map(r=>r.score));
    const h=load();h.push(rec);save(h);
  }
  last={rec,run:s,isBest};state=null;
  renderResult();show('result');renderBest();
}
function verdictOf(r){
  if(r.q&&r.qc<r.q)return {cls:'bad',head:'見たつもり注意',body:`抜き打ち確認で${r.q-r.qc}問まちがえました（1問ごとにランクが1段下がります）。1秒の間に、中身まで読み取ってください。`};
  const m=(r.sheetAvg+r.prodAvg)/2;
  if(m<0.85)return {cls:'bad',head:'せっかち傾向',body:'1秒より短く感じています。現場では「見たつもり」になりやすいので、もう一呼吸おいてください。'};
  if(m>1.15)return {cls:'warn',head:'ゆっくり傾向',body:'1秒より長く感じています。丁寧ですが、1秒のリズムに近づけましょう。'};
  if(Math.abs(r.sheetAvg-r.prodAvg)>0.15)return {cls:'warn',head:'左右で差あり',body:r.sheetAvg<r.prodAvg?'確認票（左）が短めです。確認票もしっかり1秒見ましょう。':'製品（右）が短めです。製品もしっかり1秒見ましょう。'};
  return {cls:'',head:'1秒の感覚ができています',body:'平均がほぼ1秒です。このリズムを現場でも。'};
}
const timeCls=t=>Math.abs(t-1)<=0.1?'good':(t<0.9?'bad':'warn');
function renderResult(){
  const {rec,run,isBest}=last,v=verdictOf(rec);
  const rk=$('#rank');rk.className='rank '+rec.rank;rk.textContent=rec.rank;
  $('#resSub').textContent=`${rec.name}さん　${run.practice?'練習':'本番'}　${rec.n}ポイント`;
  $('#resScore').textContent=rec.score+' 点';
  $('#newBest').hidden=!isBest;
  $('#verdict').className='verdict '+v.cls;$('#verdict').innerHTML=`<b>${v.head}</b>${v.body}`;
  $('#counts').innerHTML=[['パーフェクト','p'],['グレート','g'],['グッド','d'],['ミス','m']]
    .map(([n,k])=>`<div><span class="j-${k}">${n}</span><b>${rec[k]}</b></div>`).join('');
  $('#stats').innerHTML=[
    ['確認票（左）の平均',f2(rec.sheetAvg)+' 秒',timeCls(rec.sheetAvg)],
    ['製品（右）の平均',f2(rec.prodAvg)+' 秒',timeCls(rec.prodAvg)],
    ['1秒からの平均ズレ',f2(rec.mae)+' 秒',rec.mae<=0.1?'good':''],
    ['抜き打ち確認',`${rec.qc} / ${rec.q} 正解`,rec.qc===rec.q?'good':'bad'],
    ['最大コンボ',rec.maxCombo+'']
  ].map(([k,val,c])=>`<div class="st"><span>${k}</span><b class="${c||''}">${val}</b></div>`).join('');
  drawResultChart();
}
function drawResultChart(){
  if(!last)return;const {rec,run}=last;
  drawChart($('#resChart'),{yMin:0,yMax:2,ref:1,band:[0.8,1.2],yFmt:v=>v.toFixed(1)+'s',
    xLabels:Array.from({length:rec.n},(_,i)=>String(i+1)),
    series:[{values:run.tL,color:css('--sheet'),line:true},{values:run.tR,color:css('--hazard'),line:true}]});
}
const qStr=r=>r.q==null?'—':`${r.qc}/${r.q}`;
function resultText(r){
  return `${fmtDate(r.ts)} ${r.name} 1秒体感 ${r.n}点 ランク${r.rank} ${r.score}点 確認票${f2(r.sheetAvg)}秒 製品${f2(r.prodAvg)}秒 平均ズレ${f2(r.mae)}秒 パーフェクト${r.p} ミス${r.m} 抜き打ち${qStr(r)}`;
}
$('#btnCopy').addEventListener('click',()=>last&&copyText((last.run.practice?'【練習】':'')+resultText(last.rec)));
$('#btnAgain').addEventListener('click',()=>start(lastPractice,nPoints));
$('#btnHome').addEventListener('click',()=>show('home'));

/* ---------- グラフ ---------- */
function drawChart(cv,o){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(!w)return;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const L=44,R=12,T=10,B=24,pw=w-L-R,ph=h-T-B;
  const n=Math.max(1,...o.series.map(s=>s.values.length));
  const X=i=>n===1?L+pw/2:L+pw*i/(n-1);
  const Y=v=>T+ph*(1-(Math.min(Math.max(v,o.yMin),o.yMax)-o.yMin)/(o.yMax-o.yMin));
  if(o.band){g.fillStyle=css('--band');g.fillRect(L,Y(o.band[1]),pw,Y(o.band[0])-Y(o.band[1]))}
  g.font='12px sans-serif';g.lineWidth=1;
  for(let k=0;k<=4;k++){const v=o.yMin+(o.yMax-o.yMin)*k/4,y=Y(v);
    g.strokeStyle=css('--line');g.beginPath();g.moveTo(L,y);g.lineTo(w-R,y);g.stroke();
    g.fillStyle=css('--sub');g.textAlign='right';g.textBaseline='middle';g.fillText(o.yFmt(v),L-6,y)}
  if(o.ref!=null){g.strokeStyle=css('--ink');g.setLineDash([5,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(L,Y(o.ref));g.lineTo(w-R,Y(o.ref));g.stroke();g.setLineDash([])}
  if(o.xLabels){const step=Math.ceil(n/8);g.fillStyle=css('--sub');g.textAlign='center';g.textBaseline='top';
    o.xLabels.forEach((t,i)=>{if(i%step===0)g.fillText(t,X(i),h-B+6)})}
  o.series.forEach(s=>{
    if(s.line&&s.values.length>1){g.strokeStyle=s.color;g.lineWidth=2;g.beginPath();
      s.values.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke()}
    s.values.forEach((v,i)=>{g.fillStyle=s.colors?s.colors[i]:s.color;g.beginPath();g.arc(X(i),Y(v),s.r||4.5,0,Math.PI*2);g.fill()});
  });
}

/* ---------- 履歴 ---------- */
function renderHistory(){
  const name=$('#name').value.trim(),rs=myRecords(),body=$('#histBody');
  $('#histTitle').textContent=name?`${name}さんの履歴`:'全員の履歴';
  if(!rs.length){body.innerHTML='<div class="empty">まだ記録がありません。「本番」を1回行うと、ここに推移が出ます。</div>';return}
  const first=rs[0],recent=rs.slice(-3),avg=(a,f)=>mean(a.map(f));
  const best=Math.max(...rs.map(r=>r.score));
  let delta=`自己ベスト　${best}点（${rs.length}回実施）`;
  if(rs.length>=2)delta+=`<br>初回　${first.score}点・平均ズレ${f2(first.mae)}秒<br>直近${recent.length}回　${Math.round(avg(recent,r=>r.score))}点・平均ズレ${f2(avg(recent,r=>r.mae))}秒`;
  const cr=rs.slice(-30),labels=cr.map(r=>fmtDate(r.ts,true)),rows=rs.slice(-20).reverse();
  body.innerHTML=`<p class="delta">${delta}</p>
    <div class="chartbox"><div class="ctitle">スコアの推移</div><canvas id="hc1"></canvas></div>
    <div class="chartbox"><div class="ctitle">平均時間の推移（点線＝1秒、帯＝±0.2秒）</div><canvas id="hc2"></canvas>
      <div class="legend"><span><i style="background:var(--sheet)"></i>確認票（左）</span><span><i style="background:var(--hazard)"></i>製品（右）</span></div></div>
    <div class="tablewrap"><table><tr><th>日時</th><th>点</th><th>ランク</th><th>スコア</th><th>左</th><th>右</th><th>ズレ</th><th>抜打</th></tr>
    ${rows.map(r=>`<tr><td>${fmtDate(r.ts)}</td><td>${r.n}</td><td>${r.rank}</td><td>${r.score}</td><td>${f2(r.sheetAvg)}</td><td>${f2(r.prodAvg)}</td><td>${f2(r.mae)}</td><td>${qStr(r)}</td></tr>`).join('')}</table></div>`;
  const maxS=Math.max(...cr.map(r=>r.score),100);
  drawChart($('#hc1'),{yMin:0,yMax:Math.ceil(maxS/500)*500,yFmt:v=>String(Math.round(v)),xLabels:labels,
    series:[{values:cr.map(r=>r.score),color:css('--perfect'),line:true}]});
  drawChart($('#hc2'),{yMin:0,yMax:2,ref:1,band:[0.8,1.2],yFmt:v=>v.toFixed(1)+'s',xLabels:labels,
    series:[{values:cr.map(r=>r.sheetAvg),color:css('--sheet'),line:true},{values:cr.map(r=>r.prodAvg),color:css('--hazard'),line:true}]});
}
$('#btnHistBack').addEventListener('click',()=>show('home'));
$('#btnTsv').addEventListener('click',()=>{
  const rs=myRecords();if(!rs.length){toast('記録がありません');return}
  const head=['日時','氏名','点数','ランク','スコア','確認票平均(秒)','製品平均(秒)','平均ズレ(秒)','パーフェクト','グレート','グッド','ミス','最大コンボ','抜き打ち正解','抜き打ち回数'];
  const lines=rs.map(r=>[fmtDate(r.ts),r.name,r.n,r.rank,r.score,f2(r.sheetAvg),f2(r.prodAvg),f2(r.mae),r.p,r.g,r.d,r.m,r.maxCombo,r.qc??'',r.q??''].join('\t'));
  copyText([head.join('\t'),...lines].join('\n'));
});
$('#btnClear').addEventListener('click',()=>{
  const name=$('#name').value.trim();
  if(!confirm(name?`${name}さんの履歴をすべて削除します。元に戻せません。`:'全員の履歴をすべて削除します。元に戻せません。'))return;
  const key=name.normalize('NFKC').trim();save(load().filter(r=>key&&String(r.name||'').normalize('NFKC').trim()!==key));renderHistory();renderBest();toast('削除しました');
});

let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
  if(!$('#result').hidden)drawResultChart();if(!$('#history').hidden)renderHistory()},150)});
})();
</script>
